name: Package Push Nuget
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  package-push:
    name: package push
    runs-on: ubuntu-latest
    steps:
    - name: git pull
      uses: actions/checkout@v2
      
    - name: setting dotnet version
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: |
          6.0.x
          7.0.x
          8.0.x
          10.x
        include-prerelease: true

    - name: restore
      run: dotnet restore src/Masa.Stack.Components/Masa.Stack.Components.csproj

    - name: build
      run: dotnet build src/Masa.Stack.Components/Masa.Stack.Components.csproj --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

    - name: pack
      run: |
        VERSION=0.0.$GITHUB_RUN_NUMBER
        # 只打包库项目，避免解决方案内 MasaWasmApp 需要 wasm-tools 工作负载
        dotnet pack src/Masa.Stack.Components.Standalone/Masa.Stack.Components.Standalone.csproj --configuration Release --no-restore --include-symbols -p:PackageVersion=$VERSION
        dotnet pack src/Masa.Stack.Components/Masa.Stack.Components.csproj --configuration Release --no-restore --include-symbols -p:PackageVersion=$VERSION
    
    - name: package push
      run: dotnet nuget push "**/*.symbols.nupkg" -k  ${{secrets.NUGET_TOKEN}}  -s https://api.nuget.org/v3/index.json
